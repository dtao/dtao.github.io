<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Dan Tao - {{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/stylesheets/ideas.css" rel="stylesheet" />
    <link href="/feed.xml" rel="alternate" type="application/atom+xml" title="Dan Tao - Ideas" />
    <script src="/javascripts/lib/disqus.js"></script>
</head>

<body>
    <section id="content">
        <article id="idea">
            <h1>{{ page.title }}</h1>
            {{ content }}
        </article>
    </section>

    <section id="comments">
        <div id="disqus_thread"></div>
    </section>

    <footer>
        <span id="path">{{ page.url | remove_first: "/" }}</span>
        <a href="/ideas">Back to ideas</a>
    </footer>
</body>

</html>
